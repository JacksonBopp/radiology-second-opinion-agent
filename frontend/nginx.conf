server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: fall back to index.html for
    # any path that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors the Vite dev-server proxy (frontend/vite.config.js):
    # strip the /api prefix and forward to the backend container.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
